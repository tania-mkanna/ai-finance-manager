spring.application.name=api
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:./.env[.properties]

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.postgresql.transactional-lock=false

# Storage
app.storage.base-directory=${APP_STORAGE_BASE_DIRECTORY:./storage}
app.storage.max-file-size-bytes=${APP_RECEIPT_MAX_FILE_SIZE_BYTES:5242880}

spring.servlet.multipart.max-file-size=${APP_RECEIPT_MAX_FILE_SIZE_BYTES:5242880}B
# Keep the request limit at least 1 MiB above the file limit for multipart overhead.
spring.servlet.multipart.max-request-size=${APP_RECEIPT_MAX_REQUEST_SIZE_BYTES:6291456}B

# JWT
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
frontend.url=${FRONTEND_URL:http://localhost:5173}
